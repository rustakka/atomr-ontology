[workspace]
resolver = "2"
members = [
    "crates/atomr-ontology-core",
    "crates/atomr-ontology-rdf",
    "crates/atomr-ontology-provenance",
    "crates/atomr-ontology-store",
    "crates/atomr-ontology-extract",
    "crates/atomr-ontology-induce",
    "crates/atomr-ontology-validate",
    "crates/atomr-ontology-testkit",
    "crates/atomr-ontology-org",
    "crates/atomr-ontology",
    "crates/atomr-ontology-py",
    "examples/org_ontology_demo",
    "examples/auto_extract_from_text",
    "xtask",
]
exclude = []

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
repository = "https://github.com/rustakka/atomr-ontology"
homepage = "https://github.com/rustakka/atomr-ontology"
authors = ["atomr contributors"]

[workspace.dependencies]
# Async / runtime
tokio = { version = "1.39", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Concurrency primitives
dashmap = "6"
parking_lot = "0.12"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

# Error / utility
thiserror = "1"
anyhow = "1"
once_cell = "1"

# Testing
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }

# UUID / time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Hashing / hex / zeroize (mirrors atomr-dledger-types)
blake3 = "1"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
serde_bytes = "0.11"

# CLI / parsing
clap = { version = "4", features = ["derive"] }
url = "2"

# Internal crates
atomr-ontology-core = { path = "crates/atomr-ontology-core", version = "0.1.0" }
atomr-ontology-rdf = { path = "crates/atomr-ontology-rdf", version = "0.1.0" }
atomr-ontology-provenance = { path = "crates/atomr-ontology-provenance", version = "0.1.0" }
atomr-ontology-store = { path = "crates/atomr-ontology-store", version = "0.1.0" }
atomr-ontology-extract = { path = "crates/atomr-ontology-extract", version = "0.1.0" }
atomr-ontology-induce = { path = "crates/atomr-ontology-induce", version = "0.1.0" }
atomr-ontology-validate = { path = "crates/atomr-ontology-validate", version = "0.1.0" }
atomr-ontology-testkit = { path = "crates/atomr-ontology-testkit", version = "0.1.0" }
atomr-ontology-org = { path = "crates/atomr-ontology-org", version = "0.1.0" }
atomr-ontology = { path = "crates/atomr-ontology", version = "0.1.0" }

# Upstream sibling crates (optional, behind feature flags).
# Pinned to published crates.io versions — no path dependencies.
atomr-agents = { version = "0.9.0", default-features = false }
atomr-infer = { version = "0.8.0", default-features = false }

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
