[package]
name = "atomr-ontology-store"
description = "OntologyStore trait and in-memory implementation with builder-style pattern matching."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
atomr-ontology-core = { workspace = true }
atomr-ontology-provenance = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
parking_lot = { workspace = true }

[features]
default = []
# Pulls tokio as a runtime convenience for `MemStore`'s async surface;
# core impl uses parking_lot synchronously and is runtime-agnostic.
tokio = ["dep:tokio"]

[dev-dependencies]
tokio = { workspace = true }
criterion = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "store_throughput"
harness = false
