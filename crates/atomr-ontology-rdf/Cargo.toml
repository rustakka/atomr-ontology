[package]
name = "atomr-ontology-rdf"
description = "RDF/OWL adapter for the canonical labeled property graph in atomr-ontology-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
atomr-ontology-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }

[features]
default = ["turtle", "ntriples", "jsonld"]
# Turtle / N-Triples writers (read-only; parsers are out of scope for v0.1).
turtle = []
ntriples = []
# JSON-LD serializer.
jsonld = []

[lints]
workspace = true
