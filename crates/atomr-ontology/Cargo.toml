[package]
name = "atomr-ontology"
description = "Umbrella facade re-exporting the atomr-ontology workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
atomr-ontology-core = { workspace = true }
atomr-ontology-rdf = { workspace = true, optional = true }
atomr-ontology-provenance = { workspace = true, optional = true }
atomr-ontology-store = { workspace = true, optional = true }
atomr-ontology-extract = { workspace = true, optional = true }
atomr-ontology-induce = { workspace = true, optional = true }
atomr-ontology-validate = { workspace = true, optional = true }
atomr-ontology-org = { workspace = true, optional = true }
atomr-ontology-testkit = { workspace = true, optional = true }

# Optional sibling-ecosystem integrations.
atomr-infer = { workspace = true, optional = true }
atomr-agents = { workspace = true, optional = true }

# HTTP-based driver dependencies (only pulled with the `http-driver` feature).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = ["rdf", "provenance", "store", "extract", "induce", "validate", "org"]

# Local re-exports.
rdf = ["dep:atomr-ontology-rdf"]
provenance = ["dep:atomr-ontology-provenance"]
store = ["dep:atomr-ontology-store"]
extract = ["dep:atomr-ontology-extract"]
induce = ["dep:atomr-ontology-induce", "extract"]
validate = ["dep:atomr-ontology-validate"]
org = ["dep:atomr-ontology-org"]
testkit = ["dep:atomr-ontology-testkit", "extract"]

# Provider re-exports (delegate to atomr-infer's feature flags).
infer = ["dep:atomr-infer", "dep:async-trait"]
provider-openai = ["infer", "atomr-infer/openai"]
provider-anthropic = ["infer", "atomr-infer/anthropic"]
provider-gemini = ["infer", "atomr-infer/gemini"]
provider-litellm = ["infer", "atomr-infer/litellm"]
provider-vllm = ["infer", "atomr-infer/vllm"]
provider-candle = ["infer", "atomr-infer/candle"]
provider-ort = ["infer", "atomr-infer/ort"]
provider-tensorrt = ["infer", "atomr-infer/tensorrt"]
provider-mistralrs = ["infer", "atomr-infer/mistralrs"]
provider-cudarc = ["infer", "atomr-infer/cudarc"]

# Agent integration (single-turn AgentBackend + multi-turn AgenticAgent
# adapters). Independent of `infer` so callers can drive an agent against
# any backend, but the recommended layering for agentic ontology
# workflows is `agents` + an `atomr-infer` provider via one of the
# `agents-with-*` meta-features below.
agents = ["dep:atomr-agents", "dep:async-trait", "extract"]

# Recommended-composition meta-features. These do NOT enforce a Cargo
# dependency from `atomr-agents` to `atomr-infer` (those are external,
# independent crates) — they only guarantee the user can build an
# `AgenticDriver` that calls into an `InferBackend` underneath without
# manually composing two feature sets.
agents-with-infer       = ["agents", "infer"]
agents-with-openai      = ["agents", "provider-openai"]
agents-with-anthropic   = ["agents", "provider-anthropic"]
agents-with-gemini      = ["agents", "provider-gemini"]
agents-with-litellm     = ["agents", "provider-litellm"]
agents-with-vllm        = ["agents", "provider-vllm"]
agents-with-candle      = ["agents", "provider-candle"]

# DEPRECATED in 0.2 — slated for removal in 0.4. The recommended
# replacement is `provider-openai` / `provider-anthropic` /
# `provider-litellm` (each pulls `atomr-infer` and the matching upstream
# provider), wired through `InferBackend` or `AgentBackend`. Kept here
# so existing builds keep working through the deprecation window. See
# `crates/atomr-ontology/src/http_driver.rs` and
# `crates/atomr-ontology/examples/http_driver_migration.rs`.
http-driver = [
    "extract",
    "dep:reqwest",
    "dep:async-trait",
    "dep:tokio",
    "dep:serde",
    "dep:serde_json",
]

[dev-dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }

[lints]
workspace = true
