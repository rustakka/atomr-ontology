[package]
name = "atomr-ontology-persist"
description = "Pluggable persistent OntologyStore using atomr ecosystem persistence providers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
atomr-ontology-core = { workspace = true }
atomr-ontology-store = { workspace = true }
atomr-ontology-provenance = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"

[features]
default = []
# JSON file checkpointer (always available; useful for ad-hoc persistence).
file = ["dep:tokio"]
# SQLite checkpointer.
sqlite = ["dep:rusqlite", "dep:tokio"]

[dependencies.rusqlite]
version = "0.32"
features = ["bundled"]
optional = true

[lints]
workspace = true
