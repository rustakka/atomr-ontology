[package]
name = "atomr-ontology-remote"
description = "HTTP/JSON remote OntologyStore server and client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
atomr-ontology-core = { workspace = true }
atomr-ontology-store = { workspace = true }
atomr-ontology-provenance = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[dev-dependencies]
tokio = { workspace = true }
atomr-ontology-store = { workspace = true }

[features]
default = ["client", "server"]
client = ["dep:reqwest", "dep:tokio"]
server = ["dep:tokio"]

[lints]
workspace = true
