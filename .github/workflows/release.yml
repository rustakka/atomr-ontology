name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish (workspace, dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          for crate in atomr-ontology-core atomr-ontology-rdf atomr-ontology-provenance \
                       atomr-ontology-store atomr-ontology-extract atomr-ontology-induce \
                       atomr-ontology-validate atomr-ontology-testkit atomr-ontology-org \
                       atomr-ontology; do
            echo "==> publishing $crate"
            cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN"
          done
