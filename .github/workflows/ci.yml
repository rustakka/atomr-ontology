name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # `cargo fmt --all` walks into path-dependency source trees;
      # iterate over workspace members directly so the gate is scoped
      # to this repo regardless of how `[workspace.dependencies]` are
      # declared.
      - name: rustfmt (per workspace member)
        run: |
          set -e
          for p in $(cargo metadata --no-deps --format-version 1 \
                       | python3 -c "import json,sys;[print(p['name']) for p in json.load(sys.stdin)['packages']]"); do
            echo "==> $p"
            cargo fmt --check -p "$p"
          done

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  audit:
    name: audit (regression check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask audit

  verify:
    name: verify (1.0-rc gate)
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, audit]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask verify
