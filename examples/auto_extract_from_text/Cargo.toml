[package]
name = "auto_extract_from_text"
description = "Run the full 7-stage auto-extract pipeline against a corpus, optionally with a real provider."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
atomr-ontology = { workspace = true }
atomr-ontology-org = { workspace = true }
atomr-ontology-testkit = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = []
# Real provider features re-exported from atomr-ontology.
provider-openai = ["atomr-ontology/provider-openai"]
provider-anthropic = ["atomr-ontology/provider-anthropic"]
provider-gemini = ["atomr-ontology/provider-gemini"]
provider-litellm = ["atomr-ontology/provider-litellm"]
provider-vllm = ["atomr-ontology/provider-vllm"]
provider-candle = ["atomr-ontology/provider-candle"]
provider-ort = ["atomr-ontology/provider-ort"]
provider-tensorrt = ["atomr-ontology/provider-tensorrt"]
provider-mistralrs = ["atomr-ontology/provider-mistralrs"]
# HTTP-based driver — works with OpenAI-compatible REST endpoints
# (OpenAI, Anthropic Messages API, LiteLLM proxy) without depending
# on the heavier atomr-infer provider crates.
http-driver = ["atomr-ontology/http-driver"]

[lints]
workspace = true
